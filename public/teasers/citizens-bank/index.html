document.addEventListener('DOMContentLoaded', async function() {

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"6df73f3c-1d1a-4683-ab52-afd6263b7e1d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Base Operations \u2014 colors & typography tokens\n   Source of truth: design/design-system.md v1.1 (2026-04-13)\n   Dark is default; apply data-theme=\"light\" on :root for light mode.\n*/\n\n@font-face {\n  font-family: 'Space Grotesk';\n  src: url(\"2a16085c-13d6-4386-a1d7-be4ac920a1b9\") format('truetype-variations'),\n       url(\"2a16085c-13d6-4386-a1d7-be4ac920a1b9\") format('truetype');\n  font-weight: 300 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* \u2500\u2500 Core \u2500\u2500 */\n  --base-black: #080808;\n  --base-yellow: #FDD835;\n  --dark-yellow: #C6A700;\n  --white: #FAFAFA;\n  --pure-white: #FFFFFF;\n\n  /* \u2500\u2500 Tonal ramp (shared \u2014 from design-system + infographic-design system) \u2500\u2500\n     Derived from the canonical brand neutrals: #1C1D1F, #31393A, #505967, #E4E7EC, #F3F4F7. */\n  --gray-100: #F3F4F7;  /* light surface                 rgb(243,244,247) */\n  --gray-200: #E4E7EC;  /* border / divider (light)      rgb(228,231,236) */\n  --gray-300: #D9D9D9;  /* hairline fill                 rgb(217,217,217) */\n  --gray-400: #BFC4CC;  /* disabled text / iconography */\n  --gray-500: #8A93A1;  /* muted text (mid)            */\n  --gray-600: #505967;  /* body-secondary text           rgb(80,89,103) */\n  --gray-700: #31393A;  /* CHARCOAL \u2014 primary neutral    rgb(49,57,58) */\n  --gray-800: #1C1D1F;  /* near-black text               rgb(28,29,31) */\n  --gray-900: #0F1011;  /* deepest ink */\n\n  /* \u2500\u2500 Quintile ramp (BaseScore risk tiers) \u2500\u2500\n     Tier names/ranges are authoritative in context/basescore-risk-tiers.md.\n     Boundaries: lower-inclusive, upper-exclusive (70 = High, 90 = Critical).\n     BaseScore 0 = NO DATA \u2014 use --tier-nodata, never --q1. */\n  --q1: #78C6F5;  /* Very Low \u00b7 0\u201330 */\n  --q2: #6A93E7;  /* Low \u00b7 30\u201350 */\n  --q3: #676DD8;  /* Medium \u00b7 50\u201370 */\n  --q4: #9151B9;  /* High \u00b7 70\u201390 \u2014 violent crime becomes the governing factor */\n  --q5: #BD268E;  /* Critical \u00b7 90\u2013100 */\n\n  /* Tier aliases \u2014 prefer these on risk surfaces */\n  --tier-very-low: var(--q1);\n  --tier-low:      var(--q2);\n  --tier-medium:   var(--q3);\n  --tier-high:     var(--q4);\n  --tier-critical: var(--q5);\n  --tier-nodata:   #8A93A1;  /* BaseScore 0 / insufficient coverage */\n\n  /* \u2500\u2500 Chart palette (non-BaseScore blues) \u2500\u2500 */\n  --chart-1: #1E3082;\n  --chart-2: #2C5A9C;\n  --chart-3: #3984B6;\n  --chart-4: #47AED0;\n  --chart-5: #78C6D0;\n  --chart-6: #62BED2;\n  --chart-7: #AADACC;\n  --chart-8: #DCECC9;\n\n  /* \u2500\u2500 Semantic / functional \u2500\u2500 */\n  --success: #4CAF50;\n  --alert:   #F44336;\n  --warning: #FF9800;\n  --info:    #78C6F5;\n\n  /* \u2500\u2500 Spacing (4px base) \u2500\u2500 */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-9: 36px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* \u2500\u2500 Radii \u2500\u2500 */\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 12px;\n  --radius-xl: 16px;\n  --radius-full: 9999px;\n\n  /* \u2500\u2500 Motion \u2500\u2500 */\n  --motion-fast: 150ms;   /* @kind other */\n  --motion-normal: 300ms; /* @kind other */\n  --motion-slow: 600ms;   /* @kind other */\n  --easing: cubic-bezier(0.2, 0.7, 0.2, 1); /* @kind other */\n\n  /* \u2500\u2500 Type \u2500\u2500 */\n  --font-sans: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-light: 300;\n  --font-regular: 400;\n  --font-medium: 500;\n  --font-semibold: 600;\n  --font-bold: 700;\n\n  /* \u2500\u2500 Semantic tokens (DARK default) \u2500\u2500 */\n  --surface-primary:   #1C1D1F;\n  --surface-secondary: #31393A;\n  --surface-tertiary:  #3D4546;\n  --surface-elevated:  #31393A;\n  --text-primary:   #FAFAFA;\n  --text-secondary: #BFC4CC;\n  --text-tertiary:  #8A93A1;\n  --text-muted:     #505967;\n  --border-default: #505967;\n  --border-strong:  #BFC4CC;\n  --accent:         #FDD835;\n  --accent-text:    #FDD835;\n  --accent-surface: rgba(253,216,53,0.10);\n  --on-accent:      #080808;\n  --zone-neutral:   #31393A;\n  --zone-neutral-border: #505967;\n  --pill-neutral:   #3D4546;\n  --pill-neutral-border: #505967;\n  --zone-warm:      rgba(120,198,245,0.15);\n  --zone-warm-border: #FDD835;\n  --pill-warm:      rgba(120,198,245,0.12);\n  --pill-warm-border: rgba(120,198,245,0.25);\n  --focus-ring:     #FDD835;\n}\n\n/* \u2500\u2500 Light theme override \u2500\u2500 */\n:root[data-theme=\"light\"], .theme-light {\n  --surface-primary:   #FAFAFA;\n  --surface-secondary: #F3F4F7;\n  --surface-tertiary:  #E4E7EC;\n  --surface-elevated:  #FFFFFF;\n  --text-primary:   #1C1D1F;\n  --text-secondary: #505967;\n  --text-tertiary:  #8A93A1;\n  --text-muted:     #BFC4CC;\n  --border-default: #E4E7EC;\n  --border-strong:  #31393A;\n  --accent:         #FDD835;\n  --accent-text:    #C6A700;\n  --accent-surface: rgba(253,216,53,0.12);\n  --on-accent:      #080808;\n  --zone-neutral:   #F3F4F7;\n  --zone-neutral-border: #E4E7EC;\n  --pill-neutral:   #E4E7EC;\n  --pill-neutral-border: #D9D9D9;\n  --zone-warm:      rgba(253,216,53,0.08);\n  --zone-warm-border: #C6A700;\n  --pill-warm:      rgba(253,216,53,0.06);\n  --pill-warm-border: rgba(253,216,53,0.18);\n  --focus-ring:     #C6A700;\n}\n\n/* \u2500\u2500 Semantic type styles \u2500\u2500 */\nbody {\n  font-family: var(--font-sans);\n  color: var(--text-primary);\n  background: var(--surface-primary);\n  font-size: 16px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n}\n\n.display { font-size: 64px; font-weight: 700; line-height: 1.1;  letter-spacing: -0.015em; }\nh1, .h1  { font-size: 48px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }\nh2, .h2  { font-size: 36px; font-weight: 700; line-height: 1.2;  letter-spacing: -0.005em; }\nh3, .h3  { font-size: 28px; font-weight: 700; line-height: 1.25; }\nh4, .h4  { font-size: 22px; font-weight: 600; line-height: 1.3; }\nh5, .h5  { font-size: 18px; font-weight: 600; line-height: 1.35; }\n.body-lg { font-size: 18px; font-weight: 400; line-height: 1.6; }\n.body,  p{ font-size: 16px; font-weight: 400; line-height: 1.6; }\n.body-sm { font-size: 14px; font-weight: 400; line-height: 1.5; }\n.caption { font-size: 12px; font-weight: 600; line-height: 1.4; }\n.overline{\n  font-size: 12px; font-weight: 600; line-height: 1.4;\n  text-transform: uppercase; letter-spacing: 0.25em;\n  color: var(--text-tertiary);\n}\n.micro   { font-size: 11px; font-weight: 500; line-height: 1.3; }\n\n.mono-accent { color: var(--accent-text); }\n\n/* \u2500\u2500 Focus ring \u2500\u2500 */\n:where(a, button, [tabindex]):focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n  border-radius: 4px;\n}\n\n/* \u2500\u2500 Reduced motion \u2500\u2500 */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-delay: 0ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n/* \u2500\u2500 Slide-level tokens (applies only inside .slide) \u2500\u2500\n   Encodes deck principles #11 margins, #12 color, #13 typography.\n   Default = white slide + black ink (presentation body).\n   [data-variant=\"title\"|\"section\"|\"data\"] flips the canvas. */\n.slide {\n  /* canvas + ink */\n  --slide-canvas: var(--pure-white);\n  --slide-ink: var(--base-black);\n  --slide-muted: var(--gray-600);\n  --slide-border: var(--gray-200);\n\n  /* the ONE accent \u2014 principle #12 */\n  --slide-accent: var(--q5);         /* #BD268E highlight */\n  --slide-accent-2: var(--q4);       /* secondary hierarchy only */\n\n  /* grid + spacing \u2014 principle #11.\n     Generous margins are part of the density discipline:\n     if content doesn't fit inside these margins, the slide is overpacked. */\n  --slide-w: 1920px;\n  --slide-h: 1080px;\n  --slide-margin: 120px;\n  --slide-gutter: 56px;\n\n  /* Type ramp \u2014 principle #13.\n     Sized for 1920\u00d71080 projected at room scale. NEVER go below --slide-body-min.\n     If a slide doesn't fit, cut content, don't shrink type. */\n  --slide-display-size: 96px;       /* title-slide hero only */\n  --slide-title-size:   60px;       /* every body/data slide */\n  --slide-subtitle-size:32px;\n  --slide-body-size:    32px;       /* DEFAULT body \u2014 bullets, paragraphs, callouts */\n  --slide-body-min:     28px;       /* floor; do not override below this */\n  --slide-caption-size: 22px;       /* axis labels, chart legends, small UI */\n  --slide-footer-size:  18px;       /* sources, page numbers */\n  --slide-stat-size:    140px;      /* hero pull-stat numerals */\n\n  /* Density caps \u2014 principle #9 + the Verbosity Rule (see principles doc).\n     These are advisory CSS counters consumed by the BulletList / Callout components\n     to print red warnings when crossed. */\n  --slide-max-bullets: 5; /* @kind other */\n  --slide-max-words-per-bullet: 12; /* @kind other */\n  --slide-max-words-per-slide: 60; /* @kind other */\n\n  /* chart palette aliases \u2014 principle #7 + #12 */\n  --chart-primary: var(--chart-3);   /* Boston Blue #3984B6 */\n}\n.slide[data-variant=\"title\"],\n.slide[data-variant=\"section\"] {\n  --slide-canvas: var(--base-black);\n  --slide-ink: var(--pure-white);\n  --slide-muted: var(--gray-400);\n  --slide-border: var(--gray-700);\n}\n.slide[data-variant=\"data\"] {\n  --slide-canvas: var(--base-black);\n  --slide-ink: var(--pure-white);\n  --slide-muted: var(--gray-400);\n  --slide-border: var(--gray-700);\n}\n<\u002Fstyle>\n<script src=\"5b0ddcf5-918b-4720-8dcc-c699b98fc58e\"><\u002Fscript>\n<script src=\"d57250a2-9f08-407f-b9c4-f2fdd23212af\" integrity=\"sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"f01a3a73-d81d-4624-85c2-0fa13e69bcc2\" integrity=\"sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67\" crossorigin=\"anonymous\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #0E0F12; }\n  a { color: #FDD835; }\n  a:hover { color: #C6A700; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#0E0F12;color:#FAFAFA;font-family:var(--font-sans);padding:64px 40px 96px;display:flex;justify-content:center\">\n<div style=\"width:100%;max-width:1080px;display:flex;flex-direction:column;gap:72px;font-variant-numeric:tabular-nums\">\n\n  <header style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:center;justify-content:space-between;padding-bottom:64px;border-bottom:1px solid #31393A\">\n      <img src=\"eafa309e-4d3f-4aaf-9c02-b6198f09b50a\" alt=\"Base Operations\" style=\"width:150px;height:auto;display:block\">\n      <img src=\"80840be1-2bf7-4cb3-a946-fb85df9d1070\" alt=\"Citizens Bank\" style=\"width:200px;height:34px;display:block\">\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;color:#8A93A1\">\n      <span style=\"color:#FAFAFA\">BaseScore Portfolio Preview<\u002Fspan>\n      <span style=\"color:#505967\">/<\u002Fspan>\n      <span>Base Operations &middot; prepared for discussion<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"margin:0;font-size:48px;font-weight:700;line-height:1.1;letter-spacing:-0.015em\">Citizens Bank<\u002Fh1>\n    <p style=\"margin:0;max-width:780px;font-size:18px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">All 1,073 branches on your list were run through BaseScore, the same way the platform scores any address on earth. Below is a portion of that output: how the footprint spreads across the five risk tiers, where the sites concentrate, and two findings that fell out of the scored data without further analysis.<\u002Fp>\n    <a href=\"https://meetings.hubspot.com/matt-fuller/base-ops-demo-calendar\" target=\"_blank\" rel=\"noopener\" style=\"font-size:14px;font-weight:600;color:#FDD835;text-decoration:underline;text-underline-offset:4px;width:fit-content\">Click here to set up time to see the platform behind this<\u002Fa>\n  <\u002Fheader>\n\n\n  <section style=\"display:flex;flex-direction:column;gap:20px;border-top:1px solid #31393A;border-bottom:1px solid #31393A;padding:32px 0\">\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;color:#8A93A1\">How to read it<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px 40px\">\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#8A93A1;text-wrap:pretty\">Tiers are fixed and lower-bound inclusive: Very Low 0&ndash;30, Low 30&ndash;50, Medium 50&ndash;70, High 70&ndash;90, Critical 90&ndash;100. A score of 70 is High; 90 is Critical.<\u002Fp>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#8A93A1;text-wrap:pretty\">BaseScore is a standardized 0&ndash;100 risk score triangulated from 25,000+ sources, with monthly crime updates and bi-weekly unrest indicators. It compares any two locations on earth on one scale.<\u002Fp>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#8A93A1;text-wrap:pretty\">Above 70, violent crime is the governing factor in the score. Below 70, property crime dominates. That crossover explains most tier changes.<\u002Fp>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#8A93A1;text-wrap:pretty\">Category scores use the same 0&ndash;100 scale as the overall score, so a gap between the two is directly actionable. A BaseScore of 0 means insufficient source coverage, not zero risk.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#31393A;border:1px solid #31393A\">\n    <div style=\"background:#1C1D1F;padding:28px 24px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8A93A1\">Branches scored<\u002Fdiv>\n      <div style=\"font-size:40px;font-weight:700;line-height:1\">1,066<\u002Fdiv>\n      <div style=\"font-size:13px;color:#8A93A1;line-height:1.5\">Of 1,073 on your list. 7 returned a BaseScore of 0, which means insufficient source coverage, not zero risk.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1C1D1F;padding:28px 24px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8A93A1\">Portfolio median BaseScore<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:10px\">\n        <div style=\"font-size:40px;font-weight:700;line-height:1;color:#FDD835\">33<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;color:#6A93E7\">Low<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#8A93A1;line-height:1.5\">Scores run 1 to 74 across the footprint. Below 70, property crime governs the number.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1C1D1F;padding:28px 24px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8A93A1\">Sites at High (70+)<\u002Fdiv>\n      <div style=\"font-size:40px;font-weight:700;line-height:1\">10<\u002Fdiv>\n      <div style=\"font-size:13px;color:#8A93A1;line-height:1.5\">Nothing in the portfolio reads Critical. The High band is 0.9% of scored branches, and 2 markets carry at least one of them.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0E0F12;padding:28px 24px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#505967\">Sites flagged for review<\u002Fdiv>\n      <div style=\"font-size:40px;font-weight:700;line-height:1;color:#3E4550\">&mdash;&mdash;<\u002Fdiv>\n      <div style=\"font-size:13px;color:#505967;line-height:1.5\">Held back. In the platform this is a filter, not a deliverable: any threshold, any category, any radius.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;color:#8A93A1\">Tier distribution<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:36px;font-weight:700;line-height:1.15\">Every tier carries a decision.<\u002Fh2>\n      <p style=\"margin:0;max-width:820px;font-size:16px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">The low end carries decisions too. Sites that score Very Low year after year are where physical-security spend gets reduced and moved to somewhere it earns more, and a Low overall score still hides Medium and High readings on individual categories. Every tier here points at an action.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;height:36px;width:100%;overflow:hidden\"><div style=\"width:40.8%;background:#78C6F5\"><\u002Fdiv><div style=\"width:40.4%;background:#6A93E7\"><\u002Fdiv><div style=\"width:17.8%;background:#676DD8\"><\u002Fdiv><div style=\"width:0.9%;background:#9151B9\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#31393A;border:1px solid #31393A\">\n      <div style=\"background:#1C1D1F;padding:20px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#78C6F5\"><\u002Fspan><span style=\"font-size:13px;font-weight:600\">Very Low<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">0&ndash;30<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;line-height:1.2\">435<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">40.8% of scored sites<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1C1D1F;padding:20px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#6A93E7\"><\u002Fspan><span style=\"font-size:13px;font-weight:600\">Low<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">30&ndash;50<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;line-height:1.2\">431<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">40.4% of scored sites<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1C1D1F;padding:20px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#676DD8\"><\u002Fspan><span style=\"font-size:13px;font-weight:600\">Medium<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">50&ndash;70<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;line-height:1.2\">190<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">17.8% of scored sites<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1C1D1F;padding:20px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#9151B9\"><\u002Fspan><span style=\"font-size:13px;font-weight:600\">High<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">70&ndash;90<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;line-height:1.2\">10<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">0.9% of scored sites<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1C1D1F;padding:20px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#BD268E\"><\u002Fspan><span style=\"font-size:13px;font-weight:600\">Critical<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">90&ndash;100<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;line-height:1.2\">0<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1\">None in this portfolio<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;color:#8A93A1\">Market concentration<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:36px;font-weight:700;line-height:1.15\">Risk clusters by market, not by state<\u002Fh2>\n      <p style=\"margin:0;max-width:820px;font-size:16px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">Each circle is a market where you operate four or more branches; 24 markets qualify, covering 214 sites. Bigger means more sites. The fill is the market's median BaseScore, on the same five-tier scale used above.<\u002Fp>\n      <p style=\"margin:0;max-width:820px;font-size:16px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">Detroit reads High as a market. Michigan statewide reads 34, Low. State-level and country-index views average that difference away; the platform resolves it to the block.<\u002Fp>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"BoaCityMap\" from=\"481a7fd3-a45c-4c3e-a0e4-399f1daab95a#/city-map.js\" hint-size=\"100%,580px\"><\u002Fx-import>\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px 24px;align-items:center;padding:16px 20px;border:1px solid #31393A;background:#1C1D1F\">\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8A93A1\">Market median BaseScore<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#BFC4CC\"><span style=\"width:12px;height:12px;border-radius:50%;background:#78C6F5\"><\u002Fspan>Very Low 0&ndash;30<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#BFC4CC\"><span style=\"width:12px;height:12px;border-radius:50%;background:#6A93E7\"><\u002Fspan>Low 30&ndash;50<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#BFC4CC\"><span style=\"width:12px;height:12px;border-radius:50%;background:#676DD8\"><\u002Fspan>Medium 50&ndash;70<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#BFC4CC\"><span style=\"width:12px;height:12px;border-radius:50%;background:#9151B9\"><\u002Fspan>High 70&ndash;90<\u002Fspan>\n      <span style=\"font-size:13px;color:#8A93A1;width:100%\">Every market shown is scored &mdash; no score is held back on this map. Circle area scales with site count; the largest is Philadelphia at 35 branches.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;color:#8A93A1\">Findings<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:36px;font-weight:700;line-height:1.15\">Six findings surfaced. Two are shown.<\u002Fh2>\n      <p style=\"margin:0;max-width:820px;font-size:16px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">These came out of the same scored dataset, with no bespoke analysis behind them. In the platform you would reach both by sorting a column.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#31393A;border:1px solid #31393A\">\n\n      <div style=\"background:#1C1D1F;padding:28px 24px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#9151B9\">Cluster<\u002Fdiv>\n        <h3 style=\"margin:0;font-size:22px;font-weight:600;line-height:1.25\">5 of 6 Detroit sites read High<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">Detroit, Michigan is the highest-scoring market in the footprint: 6 branches, median 71 (High), range 68 to 74. Above 70, violent crime is the governing factor in the score.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#1C1D1F;padding:28px 24px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#9151B9\">Category gap<\u002Fdiv>\n        <h3 style=\"margin:0;font-size:22px;font-weight:600;line-height:1.25\">60 sites hide a High category<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">60 branches score below 70 overall while scoring 70 or above on at least one crime category. aggravated assault accounts for 31 of those readings and theft for 28. Toledo, Ohio is representative: BaseScore 66, Medium, with aggravated assault at 73, High.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#0E0F12;padding:28px 24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#3E4550\">Trend<\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:0.18em;color:#505967;border:1px solid #31393A;padding:3px 8px\">WITHHELD<\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:22px;font-weight:600;line-height:1.25;color:#3E4550\">Markets moving against the portfolio<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"height:9px;width:100%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:86%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:62%;background:#1C1D1F\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#0E0F12;padding:28px 24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#3E4550\">Radius<\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:0.18em;color:#505967;border:1px solid #31393A;padding:3px 8px\">WITHHELD<\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:22px;font-weight:600;line-height:1.25;color:#3E4550\">Sites worse at the doorstep than at one mile<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"height:9px;width:94%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:71%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:55%;background:#1C1D1F\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#0E0F12;padding:28px 24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#3E4550\">Region<\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:0.18em;color:#505967;border:1px solid #31393A;padding:3px 8px\">WITHHELD<\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:22px;font-weight:600;line-height:1.25;color:#3E4550\">Where the High band concentrates by region<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"height:9px;width:100%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:78%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:48%;background:#1C1D1F\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#0E0F12;padding:28px 24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#3E4550\">Coverage<\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:0.18em;color:#505967;border:1px solid #31393A;padding:3px 8px\">WITHHELD<\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:22px;font-weight:600;line-height:1.25;color:#3E4550\">Sites where source coverage limits the score<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"height:9px;width:88%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:66%;background:#1C1D1F\"><\u002Fdiv>\n          <div style=\"height:9px;width:41%;background:#1C1D1F\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;color:#8A93A1\">Sample rows<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:36px;font-weight:700;line-height:1.15\">4 markets of 24, market level only<\u002Fh2>\n      <p style=\"margin:0;max-width:820px;font-size:16px;line-height:1.6;color:#BFC4CC;text-wrap:pretty\">The scored file resolves to individual addresses across thirteen crime categories at two radii. Shown here at market level, with three categories.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #31393A;background:#1C1D1F\">\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr;gap:16px;padding:14px 20px;border-bottom:1px solid #31393A;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8A93A1\">\n        <div>Market<\u002Fdiv><div>State<\u002Fdiv><div style=\"text-align:right\">Overall<\u002Fdiv><div style=\"text-align:right\">Robbery<\u002Fdiv><div style=\"text-align:right\">Agg. assault<\u002Fdiv><div style=\"text-align:right\">Burglary<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr;gap:16px;padding:16px 20px;border-bottom:1px solid #31393A;font-size:15px\">\n        <div>Detroit<\u002Fdiv><div style=\"color:#BFC4CC\">Michigan<\u002Fdiv><div style=\"text-align:right;font-weight:600;color:#9151B9\">71<\u002Fdiv><div style=\"text-align:right;color:#9151B9\">72<\u002Fdiv><div style=\"text-align:right;color:#9151B9\">79.5<\u002Fdiv><div style=\"text-align:right;color:#9151B9\">73.5<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr;gap:16px;padding:16px 20px;border-bottom:1px solid #31393A;font-size:15px\">\n        <div>Philadelphia<\u002Fdiv><div style=\"color:#BFC4CC\">Pennsylvania<\u002Fdiv><div style=\"text-align:right;font-weight:600;color:#676DD8\">68<\u002Fdiv><div style=\"text-align:right;color:#9151B9\">71<\u002Fdiv><div style=\"text-align:right;color:#9151B9\">71<\u002Fdiv><div style=\"text-align:right;color:#676DD8\">66<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr;gap:16px;padding:16px 20px;border-bottom:1px solid #31393A;font-size:15px\">\n        <div>Pittsburgh<\u002Fdiv><div style=\"color:#BFC4CC\">Pennsylvania<\u002Fdiv><div style=\"text-align:right;font-weight:600;color:#6A93E7\">46<\u002Fdiv><div style=\"text-align:right;color:#676DD8\">54<\u002Fdiv><div style=\"text-align:right;color:#676DD8\">55<\u002Fdiv><div style=\"text-align:right;color:#676DD8\">50<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr;gap:16px;padding:16px 20px;border-bottom:1px solid #31393A;font-size:15px\">\n        <div>Woburn<\u002Fdiv><div style=\"color:#BFC4CC\">Massachusetts<\u002Fdiv><div style=\"text-align:right;font-weight:600;color:#78C6F5\">26.5<\u002Fdiv><div style=\"text-align:right;color:#78C6F5\">26.5<\u002Fdiv><div style=\"text-align:right;color:#6A93E7\">33<\u002Fdiv><div style=\"text-align:right;color:#78C6F5\">25.5<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr;gap:16px;padding:18px 20px;align-items:center;background:#0E0F12\">\n        <div style=\"font-size:13px;color:#505967\">1,000 further branches scored<\u002Fdiv>\n        <div style=\"height:9px;background:#1C1D1F\"><\u002Fdiv><div style=\"height:9px;background:#1C1D1F\"><\u002Fdiv><div style=\"height:9px;background:#1C1D1F\"><\u002Fdiv><div style=\"height:9px;background:#1C1D1F\"><\u002Fdiv><div style=\"height:9px;background:#1C1D1F\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"border:1px solid #FDD835;background:#0E0F12;padding:44px 40px;display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;color:#FDD835\">Base Operations Enterprise<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:36px;font-weight:700;line-height:1.15;max-width:820px\">Score any address, not just the 1,073 on this list<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px 40px\">\n      <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"width:6px;height:6px;background:#FDD835;margin-top:9px;flex-shrink:0\"><\u002Fspan><p style=\"margin:0;font-size:16px;line-height:1.6;color:#BFC4CC\">Every score in this portfolio, plus unlimited additional locations to search, score and compare.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"width:6px;height:6px;background:#FDD835;margin-top:9px;flex-shrink:0\"><\u002Fspan><p style=\"margin:0;font-size:16px;line-height:1.6;color:#BFC4CC\">Thirteen crime categories under each score, at quarter-mile and one-mile radius.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"width:6px;height:6px;background:#FDD835;margin-top:9px;flex-shrink:0\"><\u002Fspan><p style=\"margin:0;font-size:16px;line-height:1.6;color:#BFC4CC\">The flagged-site list, filtered to any threshold, category or radius you set.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"width:6px;height:6px;background:#FDD835;margin-top:9px;flex-shrink:0\"><\u002Fspan><p style=\"margin:0;font-size:16px;line-height:1.6;color:#BFC4CC\">Market, state and region rollups, so a footprint this size reads at any altitude.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"width:6px;height:6px;background:#FDD835;margin-top:9px;flex-shrink:0\"><\u002Fspan><p style=\"margin:0;font-size:16px;line-height:1.6;color:#BFC4CC\">Monthly crime updates and bi-weekly unrest indicators, drawn from 25,000+ sources.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"width:6px;height:6px;background:#FDD835;margin-top:9px;flex-shrink:0\"><\u002Fspan><p style=\"margin:0;font-size:16px;line-height:1.6;color:#BFC4CC\">Every score traces back to source, so the number holds up when it is questioned.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding-top:8px\">\n      <p style=\"margin:0;font-size:18px;line-height:1.5;color:#FAFAFA;max-width:520px\">If this looks valuable, let's set up time to discuss.<\u002Fp>\n      <a href=\"https://meetings.hubspot.com/matt-fuller/base-ops-demo-calendar\" target=\"_blank\" rel=\"noopener\" style=\"background:#FDD835;color:#080808;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:16px 32px;text-decoration:none;flex-shrink:0\" style-hover=\"background:#C6A700\">Book a time<\u002Fa>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:18px;font-weight:600;color:#FDD835\">Decode local threats to safeguard your global operations.<\u002Fp>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;meetingLink&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://meetings.hubspot.com/matt-fuller/base-ops-demo-calendar&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Teaser&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { meetingLink: this.props.meetingLink ?? \"https://meetings.hubspot.com/matt-fuller/base-ops-demo-calendar\" };\n  }\n}\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
  </script>
